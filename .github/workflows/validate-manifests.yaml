name: Validate manifests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML validator
        run: python -m pip install PyYAML==6.0.2

      - name: Check CA backup utility syntax and command-line interface
        run: |
          python -m py_compile scripts/backup_homelab_ca.py
          python scripts/backup_homelab_ca.py --help > /dev/null

      - name: Validate manifests and extract chart values
        run: python scripts/validate_manifests.py

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3

      - name: Validate Immich chart values and render templates
        shell: bash
        run: |
          set -euo pipefail
          CHART_URI="$(cat "$RUNNER_TEMP/immich-chart-uri.txt")"
          CHART_VERSION="$(cat "$RUNNER_TEMP/immich-chart-version.txt")"
          helm pull "$CHART_URI" --version "$CHART_VERSION" \
            --untar --untardir "$RUNNER_TEMP/immich-chart"
          helm lint "$RUNNER_TEMP/immich-chart/immich" \
            --values "$RUNNER_TEMP/immich-values.yaml"
          helm template immich "$RUNNER_TEMP/immich-chart/immich" \
            --namespace immich --values "$RUNNER_TEMP/immich-values.yaml" \
            > /dev/null
