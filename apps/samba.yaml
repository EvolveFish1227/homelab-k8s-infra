apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: samba-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/EvolveFish1227/homelab-k8s-infra.git'
    targetRevision: HEAD
    path: infrastructure/samba
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: samba
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
