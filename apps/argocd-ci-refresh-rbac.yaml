apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-ci-refresh-rbac
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/EvolveFish1227/homelab-k8s-infra.git'
    targetRevision: HEAD
    path: infrastructure/argocd-ci
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
