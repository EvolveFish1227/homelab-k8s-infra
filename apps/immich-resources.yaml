apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-resources
  namespace: argocd
  finalizers:
    - argocd.argoproj.io/resources-finalizer
spec:
  project: default
  source:
    repoURL: 'https://github.com/EvolveFish1227/homelab-k8s-infra.git'
    targetRevision: HEAD
    path: infrastructure/immich
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
