apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'ghcr.io/immich-app/immich-charts'
    chart: immich
    targetRevision: "0.13.2"
    helm:
      values: |
        controllers:
          main:
            containers:
              main:
                image:
                  tag: v3.2.0

        immich:
          persistence:
            library:
              existingClaim: immich-library-pvc

        valkey:
          enabled: true
          persistence:
            data:
              enabled: true
              type: persistentVolumeClaim
              accessMode: ReadWriteOnce
              size: 1Gi
              storageClass: local-path

        machine-learning:
          enabled: true
          controllers:
            main:
              containers:
                main:
                  resources:
                    requests:
                      cpu: "500m"
                      memory: "1Gi"
                    limits:
                      cpu: "2"
                      memory: "4Gi"
          persistence:
            cache:
              enabled: true
              type: persistentVolumeClaim
              accessMode: ReadWriteOnce
              size: 10Gi
              storageClass: local-path

        server:
          controllers:
            main:
              containers:
                main:
                  env:
                    DB_HOSTNAME: immich-postgresql
                    DB_PORT: "5432"
                    DB_DATABASE_NAME: immich
                    DB_USERNAME: immich
                    DB_PASSWORD: 'ImmichSuperSecretDBPassword123'
                  probes:
                    startup:
                      enabled: true
                      custom: true
                      spec:
                        httpGet:
                          path: /api/server/ping
                          port: http
                        initialDelaySeconds: 15
                        periodSeconds: 10
                        failureThreshold: 120
                        timeoutSeconds: 5
          ingress:
            main:
              enabled: true
              className: traefik-ingress
              annotations:
                cert-manager.io/cluster-issuer: homelab-ca-issuer
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.tls: "true"
              hosts:
                - host: photos.homelab.com
                  paths:
                    - path: /
                      pathType: Prefix
                      service:
                        identifier: main
                        port: http
              tls:
                - hosts:
                    - photos.homelab.com
                  secretName: immich-tls-cert
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
