apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'ghcr.io/immich-app/immich-charts'
    chart: immich
    targetRevision: "0.13.2"
    helm:
      values: |
        image:
          tag: v3.2.0

        env:
          DB_HOSTNAME: 'immich-postgresql'
          DB_DATABASE_NAME: 'immich'
          DB_USERNAME: 'immich'
          DB_PASSWORD: 'ImmichSuperSecretDBPassword123'
          REDIS_HOSTNAME: 'immich-valkey-master'

        immich:
          persistence:
            library:
              existingClaim: immich-library-pvc

        # postgresql:
        #  enabled: false                  
        #  host: 'immich-postgresql'
        #  database: 'immich'
        #  username: 'immich'
        #  password: 'ImmichSuperSecretDBPassword123'

        valkey:
          enabled: true
          architecture: standalone
          auth:
            enabled: true
          image:
            registry: docker.io
            repository: bitnami/valkey
            tag: 8.0.1-debian-12-r0

        machine-learning:
          enabled: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          persistence:
            cache:
              enabled: true
              type: persistentVolumeClaim
              accessMode: ReadWriteOnce
              size: 10Gi
              storageClass: local-path

        server:
          probes:
            startup:
              spec:
                initialDelaySeconds: 15
                periodSeconds: 10
                failureThreshold: 120
                timeoutSeconds: 5
          ingress:
            main:
              enabled: true
              # ingressClassName: traefik-ingress
              annotations:
                kubernetes.io/ingress.class: traefik-ingress
                cert-manager.io/cluster-issuer: homelab-ca-issuer
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.tls: "true"
              hosts:
                - host: photos.homelab.com
                  paths:
                    - path: /
                      pathType: Prefix
              tls:
                - hosts:
                    - photos.homelab.com
                  secretName: immich-tls-cert
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
