# Staging resources only. The current Prometheus StatefulSet and its PVC are
# deliberately unchanged. Do not create the replacement PVC while the old
# same-named claim exists. See docs/prometheus-storage-migration.md.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: prometheus-direct
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-direct-pv
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: prometheus-direct
  local:
    path: /srv/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - homeserver
