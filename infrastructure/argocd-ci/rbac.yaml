apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-argocd-refresh
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-argocd-refresh
  namespace: argocd
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    resourceNames:
      - root-application
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-argocd-refresh
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: github-actions-argocd-refresh
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-actions-argocd-refresh
