### Step 2: Ensure `samba-configmap.yaml` is Clean

Ensure `samba-configmap.yaml` has the verified working configuration:

```yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: samba-config
  namespace: samba
data:
  config.yml: |
    auth:
      - user: homelab
        group: users
        uid: 1000
        gid: 1000
        password: "HomelabStoragePassword123"

    global:
      - "server min protocol = SMB2_10"
      - "server max protocol = SMB3_11"
      - "ntlm auth = yes"
      - "client min protocol = SMB2_10"
      - "server signing = auto"
      - "vfs objects = acl_xattr"

    share:
      - name: storage
        path: /samba/storage
        browsable: yes
        readonly: no
        guestok: no
        validusers: homelab
        writelist: homelab
        forceuser: homelab
        forcegroup: users
