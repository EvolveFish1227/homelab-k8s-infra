apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  namespace: samba
  labels:
    app: samba
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samba
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: samba
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: samba
          image: crazymax/samba:latest
          env:
            - name: TZ
              value: UTC
            - name: SAMBA_LOG_LEVEL
              value: "1"
            - name: SAMBA_WORKGROUP
              value: "WORKGROUP"
            - name: SAMBA_SERVER_STRING
              value: "Homelab Samba Gateway"
            - name: WSDD2_ENABLE
              value: "1"
            - name: AVAHI_ENABLE
              value: "0"
          ports:
            - name: smb
              containerPort: 445
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /data/config.yml
              subPath: config.yml
            - name: storage
              mountPath: /samba/storage
            - name: samba-var-lib
              mountPath: /var/lib/samba
            - name: samba-var-cache
              mountPath: /var/cache/samba
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - CAP_CHOWN
                - CAP_FOWNER
                - CAP_SETGID
                - CAP_SETUID
      volumes:
        - name: config
          configMap:
            name: samba-config
        - name: storage
          hostPath:
            path: /mnt/storage
            type: Directory
        - name: samba-var-lib
          emptyDir: {}
        - name: samba-var-cache
          emptyDir: {}
